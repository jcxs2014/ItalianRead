      <stop offset="0%" style="stop-color:#034816"/>
      <stop offset="100%" style="stop-color:#057a2e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  <!-- Book shape -->
