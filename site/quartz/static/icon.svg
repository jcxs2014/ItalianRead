  <!-- I letter (book title) -->
  <text x="100" y="118" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#034816" text-anchor="middle">I</text>
  <!-- Italian flag stripe (top right) -->
  <rect x="148" y="48" width="12" height="24" rx="2" fill="#009246"/>
  <rect x="148" y="74" width="12" height="24" rx="0" fill="#faf8f8"/>
  <rect x="148" y="100" width="12" height="24" rx="2" fill="#ce2b37"/>
