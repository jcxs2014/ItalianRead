baseURL = "https://italianread.example.com/"
locale = "it-IT"
title = "ItalianRead — 意大利语精读"
theme = ["github.com/imfing/hextra", "PaperMod"]
enableRobotsTXT = true
hasCJKLanguage = true
enableEmoji = true

defaultContentLanguage = "it"
defaultContentLanguageInSubdir = false

paginate = 10

[permalinks]
  articles = "/:sections/:slug/"

[taxonomies]
  tag = "tags"
  category = "categories"
  source = "sources"

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "意大利语精读 — 从看中文翻译过渡到直接读懂意大利语原文"
  defaultTheme = "auto"

[params.author]
  name = "ItalianRead"
  email = "italianread@example.com"

[params.hextra]
  sidebar.placement = "left"
  sidebar.autoConfigure = true

[params.landerSearch]
  enable = true
  preset = "fuzzy"

[[menu.main]]
  name = "Articoli"
  url = "/articoli/"
  weight = 10

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 20

[[menu.main]]
  name = "Categorie"
  url = "/categories/"
  weight = 30
